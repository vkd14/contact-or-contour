[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "contact-or-contour"
version = "1.0.0"
description = "Code and per-image results for 'Contact or Contour? Supervising a Boundary Matters More Than Which Boundary for Separating Touching Nuclei' (ISBI 2027 submission)"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = ["torch>=2.6", "segmentation-models-pytorch==0.5.0", "numpy", "scipy", "scikit-image", "opencv-python-headless", "matplotlib"]

[project.optional-dependencies]
cellpose = ["cellpose==3.1.1.2"]

[tool.setuptools.packages.find]
where = ["src"]
